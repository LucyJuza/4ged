services:
  backend:
    pull_policy: build
    depends_on:
      mysql:
        condition: service_healthy 
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    ports:
      - 8086:8080
    environment:
      DBHOST: mysql
      DBUSER: root
      DBPASSWORD: password
      DBPORT: 3306
      DBNAME: games
    build:
      context: .
      dockerfile: Dockerfile 
    image: registry.forge.hefr.ch/ihm2_2024_3_rol-mic-juz-and/ihm2_2024_3_rol-mic-juz-and:latest
  mysql:
    pull_policy: build
    platform: linux/x86_64
    container_name: mysql
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: games
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "mysql"]
      timeout: 20s
      retries: 10
    volumes:
       - dbdata:/var/lib/mysql
volumes:
   dbdata:
